server {
    
    listen 8000;
    
    server_name _;
    
    root /usr/share/nginx/html;
    

    
    add_header X-Frame-Options "DENY" always;
    
    add_header X-Content-Type-Options "nosniff" always;
    
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
    

    
    location = /healthz {
        
        access_log off;
        
        default_type text/plain;
        
        return 200 "private frontend ok\n";
        
    }
    

    
    location /api/ {
        
        proxy_pass http://private-api.railway.internal:8080;
        
        proxy_set_header Host $host;
        
        proxy_set_header X-Real-IP $remote_addr;
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        
        proxy_set_header Connection "upgrade";
        
        proxy_http_version 1.1;
        
        proxy_read_timeout 120s;
        
        client_max_body_size 25m;
        
    }
    

    
    location / {
        
        try_files $uri $uri/ /index.html;
        
    }
    

    
    location = /index.html {
        
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        
    }
    

    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        
    }
    
}










































